[package]
name = "helio-ffi"
version = "0.1.0"
edition = "2021"
description = "C FFI bindings for Helio renderer"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["staticlib", "cdylib"]
name = "helio_ffi"

[dependencies]
helio = { git = "https://github.com/Far-Beyond-Pulsar/Helio.git", branch = "feat/401-hlfs-phase1" }
helio-core = { git = "https://github.com/Far-Beyond-Pulsar/Helio.git", branch = "feat/401-hlfs-phase1" }
libhelio = { git = "https://github.com/Far-Beyond-Pulsar/Helio.git", branch = "feat/401-hlfs-phase1" }
helio-default-graphs = { git = "https://github.com/Far-Beyond-Pulsar/Helio.git", branch = "feat/401-hlfs-phase1" }
glam = { version = "0.33", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
wgpu = { version = "30.0", default-features = true, features = ["vulkan", "metal", "dx12", "gles", "webgpu", "wgsl"] }
wgpu-core = { version = "30.0", features = ["capi"] }
pollster = "0.4"
raw-window-handle = "0.6.2"
log = "0.4"
